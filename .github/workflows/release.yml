name: Release

# Two ways to release, one workflow (the npm trusted publisher is bound to
# this file — keep the filename):
#
#   1. Merge a version bump to main. The gate asks the registry whether
#      package.json's version is already published; if not, this run gates,
#      publishes, and pushes the matching v* tag itself. Merges that don't
#      bump the version are no-ops.
#   2. Push a v* tag by hand (git tag v0.2.0 && git push --tags) — the
#      original flow, still supported. The tag must match package.json.
#
# npm is the entire distribution and update channel. Publishing uses npm
# trusted publishing (OIDC): no token secret — the trusted publisher (this
# repo + workflow) is configured on npmjs.com.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether this push releases
        id: decide
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag triggers the release, but package.json is what npm
            # publishes — refuse a mismatch (e.g. tagging before the bump).
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json (v$VERSION)" >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif npm view "turnlog@$VERSION" version > /dev/null 2>&1; then
            echo "turnlog@$VERSION is already on npm — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "turnlog@$VERSION is unpublished — releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The publish gate is the FULL matrix — every OS and Node line the CI
  # workflow tests, run inside the release itself. Before 0.10.1 the publish
  # job checked on ubuntu alone while ci.yml's matrix ran in parallel and
  # gated nothing, so a Windows-only failure could not block a publish (and
  # v0.10.0 shipped a Windows-broken `turnlog demo` exactly that way). A
  # release now cannot happen unless all six legs pass at the release commit.
  test:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Same prebuild verification as ci.yml: v13 bundles prebuilds in the
      # tarball — assert this platform's binary shipped and loads, with no
      # locally-compiled build/ masking a gap end users would hit.
      - name: Verify better-sqlite3 prebuild
        shell: bash
        run: |
          rm -rf node_modules/better-sqlite3/build
          node -e "
            const fs = require('fs');
            const p = 'node_modules/better-sqlite3/prebuilds/' + process.platform + '-' + process.arch + '.node';
            if (!fs.existsSync(p)) throw new Error('missing bundled prebuild: ' + p);
            require('better-sqlite3')(':memory:').prepare('select 1').get();
            console.log('prebuild OK:', p);
          "
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  publish:
    needs: [gate, test]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag on merge-triggered runs
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install runs on the runner's bundled npm 10 — npm 12 skips the
      # install scripts that build better-sqlite3's native binding. The
      # quality gates already ran in the matrix above.
      - run: npm ci
      # Trusted publishing needs npm >= 11.5, so upgrade for this step only.
      # prepack runs `npm run build`, so publish packs a fresh bin/dist/web/dist.
      # publishConfig sets access:public + provenance (repo must stay public —
      # the registry rejects provenance publishes from private repos).
      - run: npm install -g npm@latest
      - run: npm publish
      # Merge-triggered releases mint their own tag, after the publish has
      # succeeded — a failed publish must not leave a tag behind. (Pushing
      # with GITHUB_TOKEN does not re-trigger this workflow.)
      - name: Tag the release
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.gate.outputs.version }}"
          git push origin "v${{ needs.gate.outputs.version }}"
