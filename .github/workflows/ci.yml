name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A failed npm ci on a runner is otherwise a blind spot (job logs need
      # auth to download): surface the npm debug log tail as a check
      # annotation, which is public.
      - name: Surface npm failure
        if: failure()
        shell: bash
        run: |
          # The log dir is platform-specific (%LOCALAPPDATA%\npm-cache on
          # Windows) — ask npm instead of guessing.
          LOGDIR="$(npm config get cache)/_logs"
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = process.argv[1];
            let files = [];
            try { files = fs.readdirSync(dir).map((f) => path.join(dir, f)).sort().reverse(); } catch {}
            // Newest log is often our own 'config get cache' above — take the
            // newest one that belongs to the failed 'ci' run instead.
            for (const log of files) {
              const text = fs.readFileSync(log, 'utf8');
              if (!/\"argv\" \"ci\"|argv.*\bci\b|npm error/i.test(text)) continue;
              const tail = text.split(/\r?\n/).slice(-60).join('%0A');
              console.log('::error title=npm log tail (' + path.basename(log) + ')::' + tail);
              process.exit(0);
            }
            console.log('::error::no ci log among: ' + files.map((f) => path.basename(f)).join(', '));
          " "$LOGDIR"
      # better-sqlite3 v13 bundles its prebuilds inside the tarball (no
      # install script, nothing fetched at install time). Verify the binary
      # for this runner's platform actually shipped and loads, with no
      # locally-compiled build/ around to mask a gap — a missing prebuild
      # must fail here, not on an end user's machine.
      - name: Verify better-sqlite3 prebuild
        shell: bash
        run: |
          rm -rf node_modules/better-sqlite3/build
          node -e "
            const fs = require('fs');
            const p = 'node_modules/better-sqlite3/prebuilds/' + process.platform + '-' + process.arch + '.node';
            if (!fs.existsSync(p)) throw new Error('missing bundled prebuild: ' + p);
            require('better-sqlite3')(':memory:').prepare('select 1').get();
            console.log('prebuild OK:', p);
          "
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
