<!-- The Turnlog mark on its accent tile. Duplicated from Brandmark in
     src/icons.tsx, because a tab icon cannot be a React component and has no
     theme tokens to read: the hex below is the accent token's dark value and
     the glyph is its on-colour. Keep the two in step.
     NOTE: an XML comment may not contain two hyphens in a row, so token names
     are spelled out here rather than written with their leading dashes — an
     earlier revision did, and the whole file silently failed to parse, which
     a browser shows by quietly keeping the previous favicon.
     The glyph is authored in a 48 box occupying 12 to 36; translate(-8 -8)
     lands that 24-unit square at 4,4 in a 32 box, for even padding. -->
